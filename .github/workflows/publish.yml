name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check tag matches package version
        shell: bash
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          TAG="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG#v}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "Release tag $TAG does not match pyproject.toml version $VERSION"
            exit 1
          fi

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Prepare README for PyPI
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          readme = Path("README.md")
          image_url = "https://raw.githubusercontent.com/pifroggi/vs_temporalfix/refs/heads/main/README_img.webp"
          content = readme.read_text(encoding="utf-8")
          pattern = r"(?m)^https://github\.com/user-attachments/assets/[^\s]+$"
          content = re.sub(pattern, lambda match: f"[![]({image_url})]({match.group(0)})", content)
          readme.write_text(content, encoding="utf-8")
          PY

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/vs_temporalfix

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

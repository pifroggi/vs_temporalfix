[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "vs_temporalfix"
version = "2.4.0"
description = "Add Temporal Coherence to Single Image AI Upscales in VapourSynth."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "pifroggi" }]
license = "Apache-2.0"
license-files = ["LICENSE"]

keywords = [
	"vapoursynth",
	"video",
	"temporal coherence",
	"temporal consistency",
	"stabilization",
	"deshimmer",
	"denoising",
	"upscaling",
	"super resolution",
	"filtering"
]

classifiers = [
	"Programming Language :: Python :: 3",
	"Topic :: Multimedia :: Video",
    "Environment :: GPU",
]

dependencies = [
	"vapoursynth>=74",
	"vapoursynth-vszip",
	"vapoursynth-akarin",
	"vapoursynth-zsmooth",
	"vapoursynth-edgemasks",
	"vapoursynth-mvutensils>=5",
	"vapoursynth-mlrt-ort; sys_platform == 'win32'",
    "numpy",
	"onnx"
]

[project.optional-dependencies]
tensorrt = [
	"vapoursynth-mlrt-trt>=16.0; sys_platform == 'win32' or sys_platform == 'linux'",
	"tensorrt-cu13>=11.1.0.106; sys_platform == 'win32' or sys_platform == 'linux'",
	"cuda-python; sys_platform == 'win32' or sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://github.com/pifroggi/vs_temporalfix"
Repository = "https://github.com/pifroggi/vs_temporalfix"
Issues = "https://github.com/pifroggi/vs_temporalfix/issues"
